# rust_extra_projects.conf -- the 10 extra (non-Unix) Rust projects.
# Sourced by setup_rust_extra.sh and build_rust_extra_ir.sh (not run on its own).

CLONE_DIR=".build/rust-extra"          # clones (gitignored)
TARGET_DIR=".build/rust-extra-target"  # cargo build dirs (gitignored)
CORPUS_DIR="benchmarks/rust_extra"     # drivers, IR, SOURCE.md (in git)

# One line per project, fields separated by '|':
#   name | git URL | pinned commit | crate (Cargo.toml `name =`) | mode | workspace | bin package | bin name
# mode "bin":    the project has its own program; IR = that binary + the library,
#                built inside the project's own workspace (<workspace> = dir in the clone).
# mode "driver": library only; IR = our small driver program (benchmarks/rust_extra/<name>/driver)
#                + the library. The driver is its own workspace, so the project's own
#                [profile.dev] settings (e.g. RustCrypto's opt-level = 2) do not apply.
# Commits = the ones the drivers were written and tested against (2026-10-13).
PROJECTS=(
  "pulldown-cmark|https://github.com/pulldown-cmark/pulldown-cmark.git|e465cacef099b6a9af1fe8694a8b8641cc419139|pulldown-cmark|bin|.|pulldown-cmark|pulldown-cmark"
  "ruzstd|https://github.com/KillingSpark/zstd-rs.git|ff70d87461248c14cbf8baf9f8d6ccfab5ba8da3|ruzstd|bin|.|ruzstd-cli|ruzstd-cli"
  "lz4_flex|https://github.com/PSeitz/lz4_flex.git|f6251928e30af958243a3ef8f22e3071d241543d|lz4_flex|bin|lz4_bin|lz4|lz4"
  "httparse|https://github.com/seanmonstar/httparse.git|a0fa552e4e0fa9a5914a736ef3a556748fef709b|httparse|driver|||"
  "csv-core|https://github.com/BurntSushi/rust-csv.git|05612e87e6e92910d40d7214b70952b8434fef9b|csv-core|driver|||"
  "base64|https://github.com/marshallpierce/rust-base64.git|5b98ee180cc7c2a64af6cb12c724b1721550e0d0|base64|driver|||"
  "ryu|https://github.com/dtolnay/ryu.git|75f9e707e77c89717ffb9c2a01fe2c28a016cc82|ryu|driver|||"
  "qoi|https://github.com/aldanor/qoi-rust.git|81c14c4b637c326a801e40701460b654d46e8fbe|qoi|driver|||"
  "miniz_oxide|https://github.com/Frommi/miniz_oxide.git|8bfa5601cd6cb6220d63e61f5c2425f5fb13bb05|miniz_oxide|driver|||"
  "sha2|https://github.com/RustCrypto/hashes.git|138dc5a05b93f8e49cda177fc6cfd7cc43673e5d|sha2|driver|||"
)

# Splits one PROJECTS line into variables: P_NAME P_URL P_PIN P_CRATE P_MODE P_WS P_BINPKG P_BIN P_REPO
read_project() {
  IFS='|' read -r P_NAME P_URL P_PIN P_CRATE P_MODE P_WS P_BINPKG P_BIN <<<"$1"
  P_REPO="$CLONE_DIR/$(basename "$P_URL" .git)"
}

# Directory of crate $2 inside clone $1, relative to the clone ("." = root).
crate_dir() {
  local repo=$1 crate=$2 f d best=""
  while IFS= read -r f; do
    if grep -qE "^name[[:space:]]*=[[:space:]]*\"$crate\"" "$f"; then
      d=$(dirname "$f")
      if [[ -z $best || ${#d} -lt ${#best} ]]; then best=$d; fi
    fi
  done < <(find "$repo" -name Cargo.toml -not -path '*/target/*' -not -path '*/.git/*')
  [[ -z $best ]] && return 1
  [[ $best == "$repo" ]] && echo "." || echo "${best#"$repo"/}"
}